<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVerse • Login</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
  <style>
    /* ----- reset & base ----- */


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f7f9fc 0%, #f5e6e6 100%);
      padding: 1.5rem;
    }

    /* ----- main card container ----- */
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px 48px 40px 40px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.25),
        0 4px 18px 0 rgba(0, 0, 0, 0.06),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      padding: 2.5rem 2rem 2.8rem;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .login-wrapper:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px -16px rgba(0, 20, 40, 0.3);
    }

    /* ----- branding / header ----- */
    .shop-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2.2rem;
    }

    .shop-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2d3b4f, #1a2634);
      border-radius: 18px;
      color: white;
      font-size: 28px;
      box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.25);
    }

    .shop-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #121926;
      background: linear-gradient(135deg, #1f2a3a, #2f405a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.2);
    }

    .shop-sub {
      font-size: 14px;
      font-weight: 400;
      color: #4f5d73;
      margin-top: 2px;
      letter-spacing: 0.2px;
      -webkit-text-fill-color: #4f5d73;
    }

    .shop-title small {
      font-size: 16px;
      font-weight: 500;
      margin-left: 4px;
      -webkit-text-fill-color: #8895aa;
      color: #8895aa;
    }

    /* ----- welcome text ----- */
    .welcome-text {
      margin-bottom: 2rem;
    }

    .welcome-text h2 {
      font-size: 26px;
      font-weight: 600;
      color: #1e2a3a;
      letter-spacing: -0.3px;
    }

    .welcome-text p {
      color: #5a6a7e;
      font-size: 15px;
      margin-top: 6px;
      font-weight: 400;
      opacity: 0.8;
    }

    /* ----- form elements ----- */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 500;
      color: #2d3b4f;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group label i {
      color: #5f728b;
      font-size: 14px;
      width: 18px;
      text-align: center;
    }

    .input-field {
      position: relative;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 60px;
      padding: 0 18px;
      transition: all 0.2s ease;
      border: 1.5px solid #dfe5ef;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .input-field:focus-within {
      border-color: #3d506c;
      box-shadow: 0 0 0 4px rgba(45, 59, 79, 0.12);
      background: white;
    }

    .input-field i {
      color: #8b9bb2;
      font-size: 15px;
      width: 22px;
      transition: color 0.2s;
    }

    .input-field:focus-within i {
      color: #2d3b4f;
    }

    .input-field input {
      width: 100%;
      padding: 16px 8px 16px 4px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 450;
      color: #141e2b;
      outline: none;
      letter-spacing: 0.2px;
    }

    .input-field input::placeholder {
      color: #a2b2c7;
      font-weight: 400;
      font-size: 14px;
      opacity: 0.7;
    }

    /* password toggle (eye) */
    .toggle-pw {
      background: none;
      border: none;
      color: #8b9bb2;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 4px 6px 10px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }

    .toggle-pw:hover {
      color: #2d3b4f;
    }

    /* ----- options row (remember + forgot) ----- */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 8px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #34455b;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2d3b4f;
      border-radius: 5px;
      border: 1.5px solid #b8c7dd;
      cursor: pointer;
      transition: 0.15s;
    }

    .remember-me input[type="checkbox"]:hover {
      transform: scale(1.04);
    }

    .forgot-link {
      font-size: 14px;
      color: #3d506c;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1.5px dotted transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .forgot-link:hover {
      color: #1a2634;
      border-bottom-color: #1a2634;
    }

    /* ----- login button ----- */
    .login-btn {
      background: linear-gradient(135deg, #1f2b3a, #2f405a);
      border: none;
      padding: 18px 12px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 17px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 18px -10px rgba(25, 35, 50, 0.4);
      margin-top: 10px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-btn i {
      font-size: 18px;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #29394f, #3a4f6b);
      transform: scale(1.01);
      box-shadow: 0 16px 28px -12px #1f2a3a;
    }

    .login-btn:hover i {
      transform: translateX(4px);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* ----- signup link ----- */
    .signup-row {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 15px;
      color: #4b5d74;
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .signup-row a {
      color: #1f2b3a;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1.5px solid #bac8dd;
      transition: border-color 0.2s, color 0.2s;
    }

    .signup-row a:hover {
      color: #0e1723;
      border-bottom-color: #0e1723;
    }

    /* ----- divider / "or" ----- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0 6px;
    }

    .divider-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(to right, transparent, #ccd7e7, transparent);
    }

    .divider-text {
      color: #7a8b9f;
      font-size: 13px;
      font-weight: 450;
      letter-spacing: 0.5px;
    }

    /* social login buttons */
    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }

    .social-btn {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid #dce3ef;
      border-radius: 60px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      color: #1f2a3a;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px -6px rgba(0,0,0,0.08);
    }

    .social-btn i {
      font-size: 20px;
    }

    .social-btn.google i {
      color: #db4a3f;
    }

    .social-btn.apple i {
      color: #1f1f1f;
    }

    .social-btn:hover {
      background: white;
      border-color: #b3c3db;
      transform: translateY(-2px);
      box-shadow: 0 10px 18px -10px rgba(30, 40, 60, 0.2);
    }

    .social-btn:active {
      transform: scale(0.96);
    }

    /* ----- responsive tweaks ----- */
    @media (max-width: 480px) {
      .login-wrapper {
        padding: 2rem 1.25rem 2.2rem;
        border-radius: 32px;
      }
      .shop-title {
        font-size: 24px;
      }
      .shop-icon {
        width: 48px;
        height: 48px;
        font-size: 22px;
      }
      .welcome-text h2 {
        font-size: 22px;
      }
      .social-btn {
        padding: 10px 18px;
        font-size: 14px;
        gap: 8px;
      }
      .input-field input {
        padding: 14px 6px 14px 2px;
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .login-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .social-login {
        flex-direction: column;
        align-items: center;
      }
      .social-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- header / branding -->
    <div class="shop-header">
      <div class="logo">
        <i class="fas fa-crown"></i>
      </div>
      <div>
        <div class="logo">
          Crypto Meme <small></small>
        </div>
        <div class="shop-sub">Biggest crypto giveaway</div>
      </div>
    </div>

    <!-- welcome -->
    <div class="welcome-text">
      <h2>Welcome back</h2>
      <p>Sign in to access your Crypto Profile </p>
    </div>

    <!-- login form -->
    <form class="login-form" action="#" method="post">
      <!-- email -->
      <div class="input-group">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <div class="input-field">
          <i class="fas fa-envelope" style="font-size: 14px;"></i>
          <input type="email" id="email" placeholder="your@email.com" value="" required>
        </div>
      </div>

      <!-- password with toggle -->
      <div class="input-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <div class="input-field">
          <i class="fas fa-lock" style="font-size: 15px;"></i>
          <input type="password" id="password" placeholder="••••••••" value="" required>
          <button type="button" class="toggle-pw" id="togglePassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- options -->
      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- login button -->
      <button type="submit" class="login-btn">
        <span>Sign in</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <!-- divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="divider-line"></span>
      </div>

      <!-- social login -->
      <div class="social-login">
        <button type="button" class="social-btn google">
          <i class="fab fa-google"></i> Google
        </button>
        <button type="button" class="social-btn apple">
          <i class="fab fa-apple"></i> Apple
        </button>
      </div>

      <!-- sign up link -->
      <div class="signup-row">
        <span>New to Crypto Meme?</span>
        <a href="#">Create account</a>
      </div>
    </form>
  </div>

  <!-- tiny script: password toggle -->
  <script>
    (function() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          // toggle eye icon
          eyeIcon.classList.toggle('fa-eye');
          eyeIcon.classList.toggle('fa-eye-slash');
        });
      }
    })();
  </script>
</body>
</html>
